<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BOOMEX</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #16161f;
    display: flex;
    align-items: center;
    justify-content: center;
    overscroll-behavior: none;
    touch-action: none;
  }
  #gameCanvas {
    background: #2a2a3a;
    image-rendering: pixelated;
    box-shadow: 0 0 0 2px #555566;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- main.js é um módulo ES6 (usa import/export), por isso o type="module" abaixo é obrigatório -->
  <script type="module" src="main.js"></script>
</body>
</html>
