<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BOOMEX</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at center, #0b2635 0%, #03080e 72%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: min(96vw, 520px);
      height: auto;
      background: #06131d;
      image-rendering: pixelated;
      border: 2px solid #155465;
      border-radius: 18px;
      box-shadow:
        0 0 10px rgba(24, 192, 222, 0.4),
        0 0 35px rgba(24, 192, 222, 0.16),
        inset 0 0 25px rgba(24, 192, 222, 0.15);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
