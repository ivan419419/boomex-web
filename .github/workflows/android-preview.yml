name: Boomex Android preview debug
on:
  push:
    branches: ['preview/boomex-android-20261117']
    paths-ignore: ['boomex-android-preview-debug.apk']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run project tests
        run: node --test tests/*.test.js
      - name: Generate local-only Android project
        run: python3 android_preview.py
      - name: Build debug APK
        working-directory: android-preview
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: boomex-android-preview-debug
          path: android-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify APK package, version and API target
        working-directory: android-preview
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-code app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest target-sdk app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Make rebuilt APK available on preview branch
        if: github.ref == 'refs/heads/preview/boomex-android-20261117'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64,json,os,urllib.request,urllib.error
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/boomex-v2-test.apk'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          apk='android-preview/app/build/outputs/apk/debug/app-debug.apk'
          data={'message':'preview: novo APK debug limpo (v2)','branch':'preview/boomex-android-20261117','content':base64.b64encode(open(apk,'rb').read()).decode()}
          try:
              with urllib.request.urlopen(urllib.request.Request(base+'?ref=preview/boomex-android-20261117',headers=h)) as r: data['sha']=json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          with urllib.request.urlopen(urllib.request.Request(base,headers=h,data=json.dumps(data).encode(),method='PUT')) as r: print('APK v2 salvo:',r.status)
          PYCODE
